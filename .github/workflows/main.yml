name: Docker Task

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Generate a token
      id: generate-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}

    - uses: actions/checkout@v6


    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1


    - name: Build Docker image
      run: |
        docker build -t webapp:latest .


    - name: Load image into kind
      run: |
        kind load docker-image webapp:latest --name chart-testing


    - name: Deploy Kubernetes manifests
      run: |
        kubectl apply -R -f ./k8s

        echo "================ PODS ================"
        kubectl get pods -o wide

        echo "================ SERVICES ================"
        kubectl get services

        echo "================ DEPLOYMENTS ================"
        kubectl get deployments

        echo "================ STATEFULSETS ================"
        kubectl get statefulsets


        echo "================ WAITING FOR PODS ================"

        if ! kubectl wait pods --all --for=condition=Ready --timeout=120s; then

          echo "================ DESCRIBE PODS ================"
          kubectl describe pods


          echo "================ WEBAPP PODS ================"
          kubectl get pods -l app=webapp


          echo "================ POSTGRES PODS ================"
          kubectl get pods -l app=postgres


          WEBAPP_POD=$(kubectl get pods -l app=webapp -o jsonpath='{.items[0].metadata.name}')
          POSTGRES_POD=$(kubectl get pods -l app=postgres -o jsonpath='{.items[0].metadata.name}')


          echo "================ WEBAPP LOGS ================"
          kubectl logs $WEBAPP_POD || true


          echo "================ POSTGRES LOGS ================"
          kubectl logs $POSTGRES_POD || true


          exit 1
        fi


    - name: Port Forward to webservice
      run: |
        kubectl port-forward service/webapp-service 8080:80 > port-forward.log 2>&1 &
        sleep 10


    - name: Debug application logs
      run: |
        echo "========== PODS =========="
        kubectl get pods

        WEBAPP_POD=$(kubectl get pods -l app=webapp -o jsonpath='{.items[0].metadata.name}')

        echo "========== WEBAPP LOGS =========="
        kubectl logs $WEBAPP_POD

        echo "========== DESCRIBE =========="
        kubectl describe pod $WEBAPP_POD


    - name: Check application response
      run: |
        curl -v http://localhost:8080 || true


    - name: Test containers functionality
      uses: cypress-io/github-action@v6
      env:
        CYPRESS_BASE_URL: http://localhost:8080
      with:
        working-directory: ./.github/tests
